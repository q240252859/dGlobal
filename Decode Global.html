#chart_tabbar {
    border-top: 1px solid;
    cursor: default;
    display: none;
    *font-weight: bold;
    height: 22px;
    overflow: hidden;
    position: absolute;
    z-index: 1
}

#chart_tabbar ul {
    height: 100%;
    list-style: none;
    padding: 0 0 0 4px
}

#chart_tabbar li {
    display: inline-block;
    height: 100%;
    margin: 0
}

#chart_tabbar a {
    cursor: pointer;
    display: inline-block;
    height: 100%;
    margin: 0;
    padding: 3px 4px 0 4px;
    overflow: hidden
}

#chart_tabbar a:hover {
    text-decoration: none
}

.chart_container.dark #chart_tabbar {
    background-color: #0a0a0a;
    border-top-color: #404040
}

.chart_container.dark #chart_tabbar a {
    color: #e5e5e5
}

.chart_container.dark #chart_tabbar a:hover {
    background-color: #383838;
    color: #fff
}

.chart_container.dark #chart_tabbar a.selected {
    color: #ffac00
}

.chart_container.light #chart_tabbar {
    background-color: #fff;
    border-top-color: #afb1b3
}

.chart_container.light #chart_tabbar a {
    color: #393c40
}

.chart_container.light #chart_tabbar a:hover {
    background-color: #f4f4f4;
    color: #393c40
}

.chart_container.light #chart_tabbar a.selected {
    color: #f27935
}

#chart_canvasGroup {
    position: absolute;
    z-index: 0
}

#chart_mainCanvas {
    overflow: hidden;
    position: absolute;
    z-index: 0
}

#chart_overlayCanvas {
    overflow: hidden;
    position: absolute;
    z-index: 2
}

#chart_loading {
    border: 1px solid;
    border-radius: 4px;
    font-size: 18px;
    font-weight: bold;
    line-height: 48px;
    overflow: hidden;
    position: absolute;
    text-align: center;
    visibility: hidden;
    width: 200px;
    z-index: 200
}

#chart_loading.activated {
    visibility: visible
}

.chart_container.dark #chart_loading {
    border-color: #aaa;
    background-color: rgba(0, 0, 0, 0.6);
    color: #ccc
}

.chart_container.light #chart_loading {
    border-color: #afb1b3;
    background-color: rgba(244, 244, 244, 0.8);
    color: #393c40
}

#chart_parameter_settings {
    border-radius: 4px;
    border: 1px solid;
    width: 640px;
    position: absolute;
    overflow: hidden;
    visibility: hidden;
    z-index: 500
}

#chart_parameter_settings.clicked {
    visibility: visible
}

#chart_parameter_settings h2 {
    padding: 8px 12px;
    margin: 0
}

#chart_parameter_settings table {
    border-collapse: collapse;
    width: 100%
}

#chart_parameter_settings tr {
    line-height: 32px
}

#chart_parameter_settings th {
    text-align: right;
    padding: 0 4px 0 16px
}

#chart_parameter_settings input {
    width: 2em;
    margin: 0 2px 0 2px
}

#chart_parameter_settings #close_settings {
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    text-align: center;
    margin: 8px auto;
    padding: 5px 24px 5px 24px;
    width: 84px
}

#chart_parameter_settings .chart_str_default {
    margin-right: 24px
}

.chart_container.dark #chart_parameter_settings {
    background-color: rgba(0, 0, 0, 0.9);
    border-color: rgba(0, 0, 0, 0.9);
    color: #ccc;
}

.chart_container.dark #chart_parameter_settings #close_settings {
    background: #1887da;
    color: #eee
}

.chart_container.light #chart_parameter_settings {
    background-color: rgba(244, 244, 244, 0.8);
    border-color: #afb1b3;
    color: #393c40
}

.chart_container.light #chart_parameter_settings #close_settings {
    background: #1478c8;
    color: #eee
}

.chart_container input,
.chart_container button {
    border-radius: 4px;
    border: 1px solid;
    padding: 4px
}

.chart_container input[type=text] {
    width: 12em
}

.chart_container input[type=button],
.chart_container input[type=submit],
.chart_container button {
    font-family: arial, sans, serif;
    padding: 4px 8px;
    cursor: pointer
}

.chart_container.dark input,
.chart_container.dark button {
    background-color: #151515;
    border-color: #333;
    color: #ccc
}

.chart_container.light input,
.chart_container.light button {
    background-color: #ddd;
    border-color: #ddd;
    color: #222
}

.trade_container {
    width: 250px;
    height: 100%;
    float: right;
    z-index: 99999;
    font-size: 12px;
    overflow: hidden
}

.trade_container.dark {
    background: #0a0a0a;
    color: #f1f1f1
}

.m_righttop {
    position: fixed;
    top: 0;
    height: 41px;
    line-height: 41px;
    width: 230px;
    text-align: right;
    padding-right: 20px;
    font-size: 16px;
    color: #f78d15;
    font-family: Gotham, "Helvetica Neue", Helvetica, Arial, sans-serif
}

.m_righttop em {
    width: 123px;
    height: 28px;
    background-position: 0 0;
    display: block;
    float: right;
    margin-top: 5px
}

.dark .m_righttop em {
    background-position: 0 0
}

.m_rightbot {
    height: 22px;
    line-height: 22px;
    border-top: 1px solid #404040;
    width: 230px;
    text-align: right;
    padding-right: 20px;
    background-color: #0a0a0a;
    border-bottom-color: #404040
}

.m_guadan {
    margin-top: 29px;
    overflow: hidden;
    border-left: 1px solid #404040;
    border-top: 1px solid #404040
}

.m_guadan a {
    font-weight: bold;
    color: #FFF;
    text-decoration: none
}

.light .m_guadan {
    margin-top: 29px;
    overflow: hidden;
    border-left: 1px solid #afb1b3;
    border-top: 1px solid #afb1b3
}

#orderbook #asks,
#orderbook #gasks,
#orderbook #bids,
#orderbook #gbids {
    height: 195px;
    position: relative;
    display: inline-block;
    overflow: hidden
}

.symbol-title {
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    height: 16px;
    line-height: 16px;
    font-family: Arial, sans, serif;
    padding: 5px
}

.symbol-title .dark {
    color: #6BF
}

.symbol-title .infoDepth {
    margin-left: 8px;
    color: #f78d15
}

.symbol-title a:hover {
    text-decoration: underline
}

#asks,
#bids {
    width: 150px
}

#orderbook {
    padding-left: 3px;
    border-bottom: 1px solid #222;
    padding-bottom: 2px;
    margin-left: 5px;
    margin-bottom: 2px
}

#orderbook .table {
    position: absolute;
    border-collapse: collapse;
    padding: 0;
    margin: 0

#gasks .table,
#asks .table {

#orderbook .table .row {
    line-height: 13px

#orderbook .table .g {

#gasks,
#gbids {

#gasks .amount,
#gbids .amount {

}

#gasks .price,
#gbids .price {

.price {
