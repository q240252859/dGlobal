name: dglobal
description: Decode Global Exchange | Flash Transaction for Institutional Accounts

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  # Network
  dio: ^5.8.0+1
  http: ^1.2.2
  web_socket_channel: ^3.0.2
  internet_connection_checker_plus: ^2.7.1
  
  # UI
  flutter_screenutil: ^5.9.3
  pull_to_refresh_notification: ^3.1.0
  cached_network_image: ^3.4.0
  flutter_native_splash: ^2.4.0
  
  # State management
  provider: ^6.1.4
  pull_to_refresh: ^2.0.0
  
  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  
  # Utilities
  intl: ^0.18.1
  logger: ^2.0.2
  url_launcher: ^6.2.1
  
  # Trading chart
  fl_chart: ^0.65.0
  go_router: ^14.6.2
  flutter_html: ^3.0.0-beta.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700 